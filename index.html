<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome Back</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div class="hero__content">
          <p class="hero__eyebrow">Secure access</p>
          <h1>Design your next login experience.</h1>
          <p class="hero__subtitle">
            Beautiful, secure, and simple. Sign in to continue to your personalized
            workspace.
          </p>
          <div class="hero__stats">
            <div>
              <span class="hero__stat">256-bit</span>
              <span class="hero__label">Encryption</span>
            </div>
            <div>
              <span class="hero__stat">24/7</span>
              <span class="hero__label">Monitoring</span>
            </div>
            <div>
              <span class="hero__stat">99.9%</span>
              <span class="hero__label">Uptime</span>
            </div>
          </div>
        </div>
        <div class="hero__card">
          <div class="card__header">
            <div>
              <p class="card__title">Welcome back</p>
              <p class="card__subtitle">Please enter your details.</p>
            </div>
            <span class="card__badge">PRO</span>
          </div>
          <form class="card__form">
            <label class="input">
              <span>Username</span>
              <input type="text" name="username" placeholder="e.g. harper.s" />
            </label>
            <label class="input">
              <span>Password</span>
              <input type="password" name="password" placeholder="••••••••" />
            </label>
            <div class="form__meta">
              <label class="checkbox">
                <input type="checkbox" checked />
                <span>Keep me signed in</span>
              </label>
              <button class="link" type="button">Forgot password?</button>
            </div>
            <button class="button" type="submit">Sign in</button>
            <button class="button button--ghost" type="button">
              Continue with Google
            </button>
          </form>
          <p class="card__footer">
            New here? <a href="#">Create an account</a>
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
